name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint && npm test && npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nblhmcnqytcbndatrgtd.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_CJWfQ_z3-N_ohYndRV1sxQ_26ZlD2Bn
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v4
